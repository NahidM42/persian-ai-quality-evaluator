[project]
name = "persian-ai-quality-evaluator"
version = "0.1.0"
description = "Evaluate Persian AI output with deterministic text checks and a validated human rubric."
readme = "README.md"
authors = [
    { name = "Nahid", email = "195166929+NahidM42@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
persian-ai-eval = "persian_ai_quality_evaluator.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
